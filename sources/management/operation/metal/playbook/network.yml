#- import_playbook: network/netplan.yml
- name: Assign ethX interface names
  hosts: all
  become: true

  tasks:
    - name: Include networkd tasks
      ansible.builtin.include_tasks:
        file: network/networkd.yml
      when: host.os.distribution == 'fedora'

    - name: Include netplan tasks
      ansible.builtin.include_tasks:
        file: network/netplan.yml
      when: host.os.distribution == 'ubuntu'

  handlers:
    - name: Reload udev
      ansible.builtin.command:
        argv: [udevadm, control, --reload]
    - name: Trigger udev evaluation
      ansible.builtin.command:
        argv: [udevadm, trigger, -c, add, -s, net]

- name: Verify network status
  hosts: all
  tasks:
    - name: Check network connectivity
      ansible.builtin.wait_for_connection:
        timeout: 300
