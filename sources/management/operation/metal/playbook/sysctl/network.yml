- name: Network sysctl defaults
  hosts: all
  become: true
  vars:
    parameters:
      # On the second thought, let's disable any direct access from the outer
      # world. Always possible to reverse in the face of a necessity.
      net.ipv6.conf.all.disable_ipv6: '1'
  tasks:
    - ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value | string }}"
        state: present
        reload: true
        sysctl_file: "/etc/sysctl.d/90-network.conf"
      loop: "{{ parameters | dict2items }}"
      loop_control:
        label: "{{ item.key }}={{ item.value }}"
