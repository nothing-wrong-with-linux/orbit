- name: Perf sysctl setup
  hosts: all
  become: true
  vars:
    parameters:
      kernel.perf_event_paranoid: '-1'
  tasks:
    - ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value | string }}"
        state: present
        reload: true
        sysctl_file: "/etc/sysctl.d/99-perf.conf"
      loop: "{{ parameters | dict2items }}"
      loop_control:
        label: "{{ item.key }}={{ item.value }}"
