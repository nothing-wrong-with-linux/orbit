- name: SSH daemon hardening
  hosts: all
  become: true

  tasks:
    - name: Ensure sshd_config.d exists
      ansible.builtin.file:
        path: /etc/ssh/sshd_config.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Force sshd to listen on IPv4 only
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/10-address-family-inet.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          AddressFamily inet
          
          Match Address 192.168.0.0/16
            PubkeyAuthentication yes
      notify: Reload sshd

    - name: Disable authentication by default
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/00-default-access-rules.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          PubkeyAuthentication no
          PasswordAuthentication no
      notify: Reload sshd

    - name: Validate sshd configuration
      ansible.builtin.command: sshd -t
      changed_when: false

  handlers:
    - name: Reload sshd
      ansible.builtin.service:
        name: "{{ 'ssh' if ansible_facts['os_family'] == 'Debian' else 'sshd' }}"
        state: reloaded
